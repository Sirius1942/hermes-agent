name: HermesAdmin

options:
  bundleIdPrefix: com.nousresearch.hermes
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  HermesAdmin:
    type: application
    platform: macOS
    sources:
      - path: HermesAdmin
    info:
      path: HermesAdmin/Info.plist
      properties:
        CFBundleDisplayName: Hermes Admin
        CFBundleURLTypes:
          - CFBundleURLName: com.nousresearch.hermes.admin.macos
            CFBundleURLSchemes:
              - hermes-admin
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: Copyright © 2026
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nousresearch.hermes.admin.macos
        PRODUCT_MODULE_NAME: HermesAdmin
        PRODUCT_NAME: Hermes Admin
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - HermesAdminTests
      gatherCoverageData: true

  HermesAdminTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HermesAdminTests
    dependencies:
      - target: HermesAdmin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nousresearch.hermes.admin.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hermes Admin.app/Contents/MacOS/Hermes Admin"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HermesAdminUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: HermesAdminUITests
    dependencies:
      - target: HermesAdmin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nousresearch.hermes.admin.macos.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HermesAdmin

schemes:
  HermesAdmin:
    build:
      targets:
        HermesAdmin: all
        HermesAdminTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: HermesAdminTests

  HermesAdminUI:
    build:
      targets:
        HermesAdmin: all
        HermesAdminUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: HermesAdminUITests
